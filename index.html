<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#3b82f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Машқ">
<title>Машқ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#111827;--mu:#6b7280;--ln:#e5e7eb;--in:#f1f3f6;--ac:#3b82f6;--ok:#22c55e;--bad:#ef4444}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--tx:#f3f4f6;--mu:#9ca3af;--ln:#2a2e36;--in:#23272f}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--ln);padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;font-size:22px;font-weight:800}
main{padding:14px 14px 190px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-weight:600;background:var(--in);text-align:center;margin-bottom:10px}
.btn.p{background:var(--ac);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{width:auto;display:inline-block;padding:8px 12px;margin:0;font-size:14px}
.mu{color:var(--mu)}
.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.in{width:100%;padding:11px 12px;border-radius:12px;background:var(--in);border:1px solid var(--ln);outline:none}
.n{width:100%;height:38px;text-align:center;border-radius:10px;background:var(--in);font-weight:600;min-width:0;outline:none}
.n:focus,.in:focus{border-color:var(--ac)}
.sets{display:grid;grid-template-columns:26px 1.25fr 1fr 1fr 44px;gap:6px;align-items:center;margin-bottom:6px}
.sets.h{font-size:12px;color:var(--mu);text-align:center}
.pv{height:38px;border-radius:10px;border:1px dashed var(--ln);color:var(--mu);font-size:13px;font-weight:600;line-height:1.1;overflow:hidden;padding:0 2px}
.pv.has{color:var(--tx);border-style:solid;background:var(--card)}
.rt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--ln)}
.rt button{height:36px;border-radius:10px;background:var(--in);font-weight:700}
.rt button.on,.rb.on{color:#fff}
.r1{background:#22c55e!important}.r2{background:#84cc16!important}.r3{background:#eab308!important}.r4{background:#f97316!important}.r5{background:#ef4444!important}
.rb{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;background:var(--in);margin-bottom:8px;font-weight:600;text-align:left}
.rb b{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.adv{display:inline-block;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:700;margin-bottom:10px}
.adv.up{background:#dcfce7;color:#166534}.adv.eq{background:#fef9c3;color:#854d0e}.adv.st{background:#fee2e2;color:#991b1b}
@media (prefers-color-scheme:dark){.adv.up{background:#14361f;color:#86efac}.adv.eq{background:#3a320a;color:#fde047}.adv.st{background:#3b1414;color:#fca5a5}}
.ck{height:38px;border-radius:10px;background:var(--in);font-weight:700;font-size:18px}
.ck.on{background:var(--ok);color:#fff}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--ln);display:flex;z-index:10}
#nav button{flex:1;color:var(--mu);font-size:13px;font-weight:600}
#nav button.on{color:var(--ac)}
.li{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.li:last-child{border:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px}
.stats span{display:block;font-size:12px;color:var(--mu)}
.stats b{font-size:20px}
.pr{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px;margin-bottom:8px;font-weight:600}
@media (prefers-color-scheme:dark){.pr{background:#3a2c0a;color:#fcd34d}}
.prog{width:100%;height:38px;border-radius:10px;background:var(--in);font-weight:700;font-size:13px;color:var(--ac);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.prog.no{color:var(--mu);font-weight:600}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pg button{padding:16px 8px;border-radius:12px;background:var(--in);font-weight:700;border:2px solid transparent}
.pg button.on{border-color:var(--ac);color:var(--ac)}
.days{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.days button{flex:1;min-width:38px;height:36px;border-radius:10px;background:var(--in);font-size:13px;font-weight:700}
.days button.on{background:var(--ac);color:#fff}
.tg{display:inline-block;background:var(--in);border-radius:6px;padding:2px 6px;font-size:12px;font-weight:700;margin-right:4px}
.tg.on{background:var(--ac);color:#fff}
.tc.today{border:2px solid var(--ac)}
.n.s{width:52px;flex:none}
#rest{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:15;background:#111827;color:#fff;border-radius:16px;padding:10px 12px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#rest.on{display:block}
#rest .bar{height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:8px;overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--ac);transition:width .3s linear}
#rest button{background:rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px}
#rest.end{background:var(--ok)}
.rbtn{font-size:13px;font-weight:700;color:var(--ac);background:var(--in);border-radius:8px;padding:5px 8px;margin-right:6px}
.rp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.rp button{padding:14px 4px;border-radius:12px;background:var(--in);font-weight:700}
.rp button.on{background:var(--ac);color:#fff}
.th{flex:none;border-radius:10px;background:var(--in);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--mu);font-weight:800;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.imgv{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.imgv img{max-width:100%;max-height:75vh;border-radius:14px}
.ipv{width:100%;aspect-ratio:4/3;border-radius:14px;background:var(--in);display:flex;align-items:center;justify-content:center;color:var(--mu);margin-bottom:10px;overflow:hidden}
.ipv img,.ipv video{width:100%;height:100%;object-fit:contain;background:#000}
.sets.k{grid-template-columns:26px 1.25fr 1fr 1fr 1fr}
.th{position:relative}
.th .vb{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.65);color:#fff;border-radius:5px;font-size:9px;font-style:normal;padding:1px 3px;line-height:1.2}
.imgv video{max-width:100%;max-height:70vh;border-radius:14px;background:#000}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
#toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-120px);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;transition:transform .25s;font-size:15px;white-space:nowrap;max-width:90%}
#toast.on{transform:translate(-50%,0)}
.lv{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;margin-bottom:8px;background:var(--in);width:100%;text-align:left}
.lv.go{background:#dcfce7;color:#166534}
@media (prefers-color-scheme:dark){.lv.go{background:#14361f;color:#86efac}}
.dots{letter-spacing:1px;color:var(--ac)}
.lv.go .dots{color:inherit}
.kg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kz{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.kf span{display:block;font-size:12px;color:var(--mu);text-align:center;margin-bottom:3px;font-weight:600}
.kz .kf:nth-child(1) span{color:#9ca3af}.kz .kf:nth-child(2) span{color:#3b82f6}.kz .kf:nth-child(3) span{color:#22c55e}.kz .kf:nth-child(4) span{color:#f97316}.kz .kf:nth-child(5) span{color:#ef4444}
</style>
</head>
<body>
<header id="hd"></header>
<main id="main"></main>
<nav id="nav">
 <button data-tab="today">Машғулот</button>
 <button data-tab="tpl">Тўпламлар</button>
 <button data-tab="hist">Тарих</button>
 <button data-tab="ex">Машқлар</button>
</nav>
<div id="rest"><div class="row"><span style="font-size:13px;opacity:.8" id="rl">Дам олиш</span><span class="sp"></span><b id="rt" style="font-size:26px;font-variant-numeric:tabular-nums">0:00</b></div>
<div class="row" style="margin-top:8px;gap:6px"><button data-rt="-15">−15</button><button data-rt="15">+15</button><span class="sp"></span><button data-rt="x">Ўтказиш ⏭</button></div><div class="bar"><i id="rb"></i></div></div>
<div id="toast"></div>
<script>
'use strict';
const KEY='mashq_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const fmtK=n=>String(Math.round((+n||0)*100)/100);
const pad=n=>String(n).padStart(2,'0');
const WD=['Якшанба','Душанба','Сешанба','Чоршанба','Пайшанба','Жума','Шанба'];
const MON=['Январь','Феврал','Март','Апрел','Май','Июнь','Июл','Август','Сентябр','Октябр','Ноябр','Декабр'];
const fmtDate=t=>{const d=new Date(t);return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const shortD=t=>{const d=new Date(t);return `${pad(d.getDate())}.${pad(d.getMonth()+1)}`};
const fmtDur=ms=>{const m=Math.round(ms/60000);if(m<1)return '1 дақ';const h=Math.floor(m/60);return h?`${h} соат ${m%60} дақ`:`${m} дақ`};
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${pad(m)}:${pad(x)}`:`${m}:${pad(x)}`};
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()};
const exLabel=t=>t==='k'?'Югуриш (вақт, км, ккал)':t==='t'?'Вақт (дақиқа)':t==='r'?'Фақат такрор (ўз вазни)':'Вазн × такрор (кг)';
const one=t=>t==='t'||t==='k';
const TYPE_OPTS=v=>[['w','Вазн × такрор (кг)'],['r','Фақат такрор (ўз вазни)'],['t','Вақт (дақиқа)'],['k','Югуриш (вақт, км, ккал)']].map(([k,n])=>`<option value="${k}"${k===v?' selected':''}>${n}</option>`).join('');

const exDef=id=>S.ex.find(e=>e.id===id);
const KF=['a','d','c','hr','sn','z1','z2','z3','z4','z5'];
const kTxt=s=>{const z=[1,2,3,4,5].filter(i=>num(s['z'+i])).map(i=>'Z'+i+' '+fmtK(s['z'+i]));
 return [num(s.a)?fmtK(s.a)+' дақ':'',num(s.d)?fmtK(s.d)+' км':'',num(s.c)?Math.round(num(s.c))+' ккал':'',num(s.hr)?'❤ '+Math.round(num(s.hr)):'',num(s.sn)?'Strain '+fmtK(s.sn):'',z.length?'('+z.join(', ')+' дақ)':''].filter(Boolean).join(' · ')||'—'};
const isDone=(e,s)=>e.type==='k'?KF.some(f=>num(s[f])>0):!!s.done;
/* ---------- Даража ва кунлар ҳисоби ---------- */
const UNIT={w:'кг',r:'та',t:'дақ'};
const lvOf=e=>{if(e.type==='k'||!e.sets.length)return 0;const ss=e.type==='w'?e.sets.filter(s=>(+s.b||0)>0):e.sets;if(!ss.length)return 0;
 return Math.round(Math.max(...ss.map(s=>e.type==='r'?+s.b||0:+s.a||0))*100)/100};
const progDef=t=>t==='w'?{n:5,st:1}:t==='r'?{n:3,st:1}:{n:3,st:0.5};
const progOf=id=>{const e=exDef(id),d=progDef(e?e.type:'w');return{n:e&&e.pn||d.n,st:e&&e.ps||d.st}};
// Охирги даража ва у неча кун (машғулот куни) такрорланганини ҳисоблайди
function streak(id,type,upto=S.wo.length-1){
 let v=null,n=0,lastDay='';
 for(let i=upto;i>=0;i--){const w=S.wo[i],e=w.exercises.find(x=>x.exId===id);if(!e)continue;if(e.type!==type)break;
  const l=lvOf(e),day=new Date(w.start).toDateString();
  if(v===null){v=l;n=1;lastDay=day}else if(l===v){if(day!==lastDay){n++;lastDay=day}}else break}
 return v===null||v<=0?null:{v,n};
}
const dots=(n,t)=>t>12?'':'●'.repeat(Math.min(n,t))+'○'.repeat(Math.max(0,t-n));
const setTxt=(e,s)=>e.type==='k'?kTxt(s):e.type==='t'?`${fmtK(s.a)} дақ`:e.type==='r'?`${s.b} та`:`${fmtK(s.a)}×${s.b}`;
function load(){
 let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!d||!Array.isArray(d.ex)){d={ex:[
  {id:uid(),name:'Штанга билан ўтириш',type:'w'},
  {id:uid(),name:'Ётиб штанга сиқиш',type:'w'},
  {id:uid(),name:'Становой тортиш',type:'w'},
  {id:uid(),name:'Юқори блокни тортиш',type:'w'},
  {id:uid(),name:'Турникда тортилиш',type:'r'},
  {id:uid(),name:'Югуриш',type:'k'},
  {id:uid(),name:'Планка',type:'t'}],wo:[],active:null}}
 d.wo=d.wo||[];d.active=d.active||null;
 if(!Array.isArray(d.tpl))d.tpl=[{id:uid(),name:'1-тўплам',days:[1,3,5],items:[]},{id:uid(),name:'2-тўплам',days:[2,4,6],items:[]}];
 const run=new Set();d.ex.forEach(e=>{if(e.type==='t'&&e.name==='Югуриш'){e.type='k';run.add(e.id)}delete e.progs});
 const fx=e=>{if(run.has(e.exId)&&e.type==='t'){e.type='k';e.sets.forEach(s=>delete s.p)}};
 d.wo.forEach(w=>w.exercises.forEach(fx));if(d.active)d.active.exercises.forEach(fx);
 if(d.active)d.active.exercises.forEach(e=>{if(e.type==='k'&&e.sets.length>1)e.sets=[e.sets.find(s=>KF.some(f=>num(s[f])>0))||e.sets[0]]});
 if(!d.ppl6){d.tpl=d.tpl.filter(t=>t.items.length);addPPL(d);d.ppl6=1}
 return d;
}
/* ---------- 6 кунлик PPL дастури ---------- */
// [ном, тур, сет, мақсад, асосий машқ (узоқ дам)]
const PPL=[
 ['Push A (кучга)',1,[['Barbell Bench Press','w',4,'6–8',1],['Incline Dumbbell Press','w',3,'8–10',1],['Seated Dumbbell Shoulder Press','w',3,'8–10'],['Dumbbell Lateral Raise','w',3,'12–15'],['Dips','r',3,'макс'],['Cable Triceps Pushdown','w',3,'10–12']]],
 ['Pull A (кучга)',2,[['Pull-Ups','r',4,'6–8',1],['Barbell Bent-Over Row','w',4,'6–8',1],['Seated Cable Row','w',3,'10'],['Face Pull','w',3,'12–15'],['Barbell Curl','w',3,'8–10'],['Hammer Curl','w',3,'10–12']]],
 ['Legs A (кучга)',3,[['Barbell Back Squat','w',4,'6–8',1],['Romanian Deadlift','w',3,'8–10',1],['Leg Press','w',3,'10–12'],['Lying Leg Curl','w',3,'12'],['Standing Calf Raise','w',4,'12–15'],['Plank','t',3,'45–60 с']]],
 ['Push B (ҳажмга)',4,[['Incline Barbell Bench Press','w',4,'8–10',1],['Dumbbell Flat Bench Press','w',3,'10–12'],['Arnold Press','w',3,'10–12'],['Cable Lateral Raise','w',3,'15'],['Cable Chest Fly','w',3,'12–15'],['Overhead Dumbbell Triceps Extension','w',3,'12']]],
 ['Pull B (ҳажмга)',5,[['Lat Pulldown (Wide Grip)','w',4,'10–12',1],['One-Arm Dumbbell Row','w',3,'10–12'],['Chest-Supported Machine Row','w',3,'12'],['Rear Delt Dumbbell Fly','w',3,'15'],['Incline Dumbbell Curl','w',3,'12'],['Cable Curl','w',3,'12–15']]],
 ['Legs B (ҳажмга)',6,[['Goblet Squat','w',4,'10',1],['Walking Dumbbell Lunges','w',3,'10 ҳар оёққа'],['Leg Extension','w',3,'12–15'],['Hip Thrust','w',3,'10–12',1],['Seated Calf Raise','w',4,'15'],['Hanging Leg Raise','r',3,'12']]]
];
function addPPL(d){
 PPL.forEach(([name,day,list])=>{
  if(d.tpl.some(t=>t.name===name))return;
  const items=list.map(([n,type,sets,r,big])=>{
   let e=d.ex.find(x=>x.name.toLowerCase()===n.toLowerCase());
   if(!e){e={id:uid(),name:n,type,rest:type==='t'?60:big?150:75};d.ex.push(e)}
   return{exId:e.id,n:sets,r};
  });
  d.tpl.push({id:uid(),name,days:[day],items});
 });
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Хотира тўлди — баъзи расмларни ўчиринг')}}
let S=load();
let tab='today';

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function sheet(html){const bg=document.createElement('div');bg.className='ov';bg.innerHTML=`<div class="sheet">${html}</div>`;document.body.appendChild(bg);bg.onclick=e=>{if(e.target===bg)bg.remove()};return bg}
const lastEx=id=>{for(let i=S.wo.length-1;i>=0;i--){const e=S.wo[i].exercises.find(x=>x.exId===id);if(e)return e}return null};
const RATE=['','Жуда осон','Осон','Ўртача','Қийин','Жуда қийин'];
const advice=r=>!r?'':r<=2?`<div class="adv up">Олдинги баҳо: ${r} — ⬆ бу сафар кучайтиринг</div>`:r<=4?`<div class="adv eq">Олдинги баҳо: ${r} — шу ҳолича давом этинг</div>`:`<div class="adv st">Олдинги баҳо: ${r} — ⏸ кучайтирманг</div>`;
const lastWo=id=>{for(let i=S.wo.length-1;i>=0;i--){if(S.wo[i].exercises.some(x=>x.exId===id))return S.wo[i]}return null};
const pvTxt=(ex,q)=>{if(!q)return '—';if(ex.type==='k'){const x=[q.d?fmtK(q.d)+'км':'',q.c?Math.round(q.c)+'ккал':''].filter(Boolean).join(' ');return `${fmtK(q.a)} дақ${x?'<br><small>'+x+'</small>':''}`}if(ex.type==='t')return `${fmtK(q.a)} дақ`;if(ex.type==='r')return `${q.b??0} та`;return `${fmtK(q.a)} кг × ${q.b}`};

function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
 $('#hd').textContent=tab==='today'?'Машғулот':tab==='hist'?'Тарих':tab==='tpl'?'Тўпламлар':'Машқлар';
 if(tab==='today')rToday();else if(tab==='hist')rHist();else if(tab==='tpl')rTpl();else rEx();
}

/* ---------- Машғулот ---------- */
function rToday(){

 }

 m.innerHTML=`<input class="in" id="wname" value="${esc(act.name)}" style="font-size:20px;font-weight:800;margin-bottom:8px">
 <div class="row mu sm" style="margin-bottom:12px"><span id="clk">${clock(Date.now()-act.start)}</span><span class="sp"></span><button class="btn sm d" data-a="discard">Бекор қилиш</button></div>

function exBlock(ex,ei){
 const t=ex.type==='t',r=ex.type==='r',k=ex.type==='k',prev=lastEx(ex.exId),rs=restOf(ex.exId);
 return `<div class="card">
 <div class="row" style="margin-bottom:2px">${thumb(ex.exId,ex.name,52,'img:'+ex.exId)}<b class="sp" style="font-size:17px">${esc(ex.name)}</b>${k?'':`<button class="rbtn" data-a="rset:${ei}">⏱ ${rs?clock(rs*1000):'йўқ'}</button>`}<button class="btn sm d" data-a="rm:${ei}">✕</button></div>
 ${ex.tg?`<div class="sm" style="font-weight:700;color:var(--ac);margin-bottom:2px">🎯 Мақсад: ${esc(ex.tg)}</div>`:''}
 <div class="mu sm" style="margin-bottom:${prev&&prev.rate?4:10}px">${prev?`Охирги марта: ${shortD(lastWo(ex.exId).start)}`:'Биринчи марта бажариляпти'}</div>
 ${prev?advice(prev.rate):''}
 ${k?'':lvLine(ex)}
 ${k?kForm(ex,ei,prev):`<div class="sets h"><span>№</span><span>ОЛДИНГИ</span><span>${t?'ДАҚИҚА':r?'ТАКРОР':'КГ'}</span><span>${t||r?'':'ТАКРОР'}</span><span>✓</span></div>
 ${(()=>{const pi=streak(ex.exId,ex.type),pg=progOf(ex.exId),sug=pi&&pi.n>=pg.n?fmtK(pi.v+pg.st):null;
 return ex.sets.map((s,si)=>{const p=prev&&prev.sets[si];
  const inp=(f,m,ph)=>`<input class="n" inputmode="${m}" value="${esc(s[f])}" placeholder="${ph}" data-f="${f}" data-e="${ei}" data-s="${si}">`;
  const head=`<span class="mu" style="text-align:center">${si+1}</span><button class="pv ${p?'has':''}" ${p?`data-a="cp:${ei}:${si}"`:''}>${pvTxt(ex,p)}</button>`;
  return `<div class="sets">${head}
  ${r?inp('b','numeric',sug||(p&&p.b?p.b:'0'))+'<span></span>':inp('a','decimal',sug||(p?fmtK(p.a):(t?'дақ':'кг')))+(t?'<span></span>':inp('b','numeric',p?p.b:'0'))}
  <button class="ck ${s.done?'on':''}" data-a="done:${ei}:${si}">✓</button>
 </div>`}).join('')})()}
 <div class="row sm" style="gap:18px;margin-top:4px"><button class="mu" data-a="addset:${ei}">+ Сет</button>${prev?`<button class="mu" data-a="use:${ei}">↺ Олдингидек</button>`:''}</div>`}
 <div class="rt">${[1,2,3,4,5].map(n=>`<button class="${ex.rate===n?'on r'+n:''}" data-a="rate:${ei}:${n}">${n}</button>`).join('')}</div>
 <div class="mu sm" style="text-align:center;margin-top:4px">${ex.rate?'Баҳо: '+RATE[ex.rate]:'Баҳо: 1 — осон … 5 — жуда қийин'}</div>
 </div>`;
}

function lvLine(ex){
 const pi=streak(ex.exId,ex.type),pg=progOf(ex.exId),u=UNIT[ex.type]||'';
 const live=lvOf({type:ex.type,sets:ex.sets.filter(s=>s.done).map(s=>({a:num(s.a),b:num(s.b)}))});
 const L=(cls,txt)=>`<button class="lv ${cls}" data-a="rnx:${ex.exId}">${txt}</button>`;
 if(!pi)return live>0?L('',`📈 Бугун: ${fmtK(live)} ${u} — 1-кун <span class="dots">${dots(1,pg.n)}</span>`):'';
 if(live>0&&live!==pi.v)return L('',`📈 Янги даража: ${fmtK(live)} ${u} — 1-кун <span class="dots">${dots(1,pg.n)}</span>`);
 if(live>0)return L(pi.n+1>=pg.n?'go':'',`📈 ${fmtK(pi.v)} ${u} — бугун ${pi.n+1}-кун <span class="dots">${dots(pi.n+1,pg.n)}</span>${pi.n+1>=pg.n?' · кейингисида ⬆':''}`);
 if(pi.n>=pg.n)return L('go',`⬆ ${fmtK(pi.v)} ${u} × ${pi.n} кун бажарилди — бугун ${fmtK(pi.v+pg.st)} ${u} га ўтинг`);
 return L('',`📈 ${fmtK(pi.v)} ${u} — ${pi.n}-кун бажарилди <span class="dots">${dots(pi.n,pg.n)}</span> <span class="mu">яна ${pg.n-pi.n} кун</span>`);
}
function kForm(ex,ei,prev){
 if(!ex.sets.length)ex.sets.push({a:'',d:'',c:'',done:false});
 const s=ex.sets[0],p=prev&&prev.sets[0];
 const ph=(f,d)=>p&&num(p[f])?fmtK(p[f]):d;
 const F=(f,l,m,d)=>`<label class="kf"><span>${l}</span><input class="n" inputmode="${m}" value="${esc(s[f])}" placeholder="${ph(f,d)}" data-f="${f}" data-e="${ei}" data-s="0"></label>`;
 return `<div class="kg">${F('a','Вақт, дақ','decimal','—')}${F('d','Масофа, км','decimal','—')}${F('c','Ккал','numeric','—')}</div>
 <div class="kg" style="grid-template-columns:1fr 1fr;margin-top:8px">${F('hr','❤ Ўртача пульс','numeric','уд/дақ')}${F('sn','Strain','decimal','0–21')}</div>
 <div class="mu sm" style="margin:10px 0 4px">Юрак уриш зоналарида вақт (дақиқа):</div>
 <div class="kz">${[1,2,3,4,5].map(z=>F('z'+z,'Z'+z,'decimal','—')).join('')}</div>
 ${prev?`<div class="row sm" style="margin-top:8px"><button class="mu" data-a="use:${ei}">↺ Олдингидек</button></div>`:''}`;
}

function tplEdit(id){
 const src=S.tpl.find(x=>x.id===id);
 const T=src?JSON.parse(JSON.stringify(src)):{id:uid(),name:'',days:[],items:[]};
 const sh=sheet(`<div style="font-weight:800;font-size:18px;margin-bottom:12px">${src?'Тўпламни таҳрирлаш':'Янги тўплам'}</div>
 <input class="in" id="tn" placeholder="Номи, масалан: Кўкрак ва елка" value="${esc(T.name)}" style="margin-bottom:10px">
 <div class="mu sm" style="margin-bottom:6px">Қайси кунлари:</div>
 <div class="days" id="td"></div>
 <div class="mu sm" style="margin-bottom:6px">Машқлар ва сетлар сони:</div>
 <div id="ti"></div>
 <button class="btn" id="ta" style="margin-top:8px">+ Машқ қўшиш</button>
 <button class="btn p" id="ok">Сақлаш</button>`);
 const draw=()=>{
  sh.querySelector('#td').innerHTML=DORD.map(d=>`<button class="${T.days.includes(d)?'on':''}" data-d="${d}">${DSH[d]}</button>`).join('');
  sh.querySelector('#ti').innerHTML=T.items.map((i,k)=>{const e=S.ex.find(x=>x.id===i.exId);if(!e)return '';return `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--ln)">
   ${thumb(e.id,e.name,36)}<span class="sp"><b>${esc(e.name)}</b></span>
   ${one(e.type)?'':`<input class="n s" inputmode="numeric" value="${i.n}" data-n="${k}"><span class="mu sm">сет</span>`}
   <button class="btn sm" data-u="${k}" ${k?'':'disabled style="opacity:.3"'}>↑</button>
   <button class="btn sm" data-w="${k}" ${k<T.items.length-1?'':'disabled style="opacity:.3"'}>↓</button>
   <button class="btn sm d" data-r="${k}">✕</button></div>`}).join('')||'<div class="mu sm" style="padding:8px 0">Ҳали машқ йўқ</div>';
 };
 draw();
 sh.querySelector('#td').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=+b.dataset.d;T.days=T.days.includes(d)?T.days.filter(x=>x!==d):[...T.days,d];draw()};
 sh.querySelector('#ti').oninput=e=>{const k=e.target.dataset.n;if(k!=null)T.items[+k].n=Math.max(1,Math.min(20,parseInt(e.target.value)||1))};
 sh.querySelector('#ti').onclick=e=>{const u=e.target.closest('[data-u]'),w=e.target.closest('[data-w]'),r=e.target.closest('[data-r]');
  if(u){const k=+u.dataset.u;if(k>0){[T.items[k-1],T.items[k]]=[T.items[k],T.items[k-1]];draw()}}
  else if(w){const k=+w.dataset.w;if(k<T.items.length-1){[T.items[k+1],T.items[k]]=[T.items[k],T.items[k+1]];draw()}}
  else if(r){T.items.splice(+r.dataset.r,1);draw()}};
 sh.querySelector('#ta').onclick=()=>{
  const ps=sheet(`<div style="font-weight:800;font-size:18px;margin-bottom:10px">Машқларни белгиланг</div>
  <div id="pl"></div><button class="btn p" id="dn" style="margin-top:10px">Тайёр</button>`);
  const pd=()=>{ps.querySelector('#pl').innerHTML=S.ex.map(e=>{const on=T.items.some(i=>i.exId===e.id);return `<button class="li" data-id="${e.id}">${thumb(e.id,e.name,44)}<span class="sp"><b>${esc(e.name)}</b><br><small class="mu">${exLabel(e.type)}</small></span><span style="font-size:22px;color:${on?'var(--ok)':'var(--mu)'}">${on?'✓':'+'}</span></button>`}).join('')};
  pd();
  ps.querySelector('#pl').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=b.dataset.id,k=T.items.findIndex(i=>i.exId===id);
   if(k>=0)T.items.splice(k,1);else{const ex=S.ex.find(x=>x.id===id),l=lastEx(id);T.items.push({exId:id,n:one(ex.type)?1:(l?Math.max(1,l.sets.length):3)})}pd()};
  ps.querySelector('#dn').onclick=()=>{ps.remove();draw()};
  ps.onclick=e=>{if(e.target===ps){ps.remove();draw()}};
 };
 sh.querySelector('#ok').onclick=()=>{
  T.name=sh.querySelector('#tn').value.trim();if(!T.name){toast('Тўплам номини киритинг');return}
  if(src)Object.assign(src,T);else S.tpl.push(T);
  save();sh.remove();render();toast('Сақланди ✓');
 };
}

function addEx(id){
 const ex=S.ex.find(e=>e.id===id);if(!ex||!S.active)return;
 const last=lastEx(id);
 const n=ex.type==='k'?1:last?Math.max(1,last.sets.length):(one(ex.type)?1:3);
 S.active.exercises.push({exId:id,name:ex.name,type:ex.type,sets:Array.from({length:n},()=>({a:'',b:'',done:false}))});
 save();render();
}

function newEx(){
 const sh=sheet(`<div style="font-weight:800;font-size:18px;margin-bottom:12px">Янги машқ</div>

  const n=sh.querySelector('#en').value.trim();if(!n){toast('Машқ номини киритинг');return}

 };
}

/* ---------- Расм ва видео ---------- */
const VDB=(()=>{let P;
 const db=()=>P||(P=new Promise((res,rej)=>{const r=indexedDB.open('mashq_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');r.onsuccess=()=>res(r.result);r.onerror=()=>{P=null;rej(r.error)}}));
 const tx=(m,f)=>db().then(d=>new Promise((res,rej)=>{const t=d.transaction('v',m),q=f(t.objectStore('v'));t.oncomplete=()=>res(q&&q.result);t.onerror=t.onabort=()=>rej(t.error)}));
 return{get:k=>tx('readonly',s=>s.get(k)),put:(k,v)=>tx('readwrite',s=>s.put(v,k)),del:k=>tx('readwrite',s=>s.delete(k))};
})();
const exImg=id=>{const e=S.ex.find(x=>x.id===id);return e&&e.img||''};
const thumb=(id,name,sz,act)=>{const e=exDef(id),im=e&&e.img||'',vd=e&&(e.vid||e.vurl);return `<span class="th" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz/2.4)}px" ${act?`data-a="${act}"`:''}>${im?`<img src="${im}" alt="">`:vd?'🎬':(act&&act.startsWith('img')?'📷':esc((name||'?').trim()[0]||'?'))}${im&&vd?'<i class="vb">▶</i>':''}</span>`};
function readImg(cb){
 const i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const M=480,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
   const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);cb(c.toDataURL('image/jpeg',0.72))};
  im.onerror=()=>toast('Расмни очиб бўлмади');im.src=u};
 i.click();
}
function readVid(cb){
 const i=document.createElement('input');i.type='file';i.accept='video/*';
 i.onchange=()=>{const f=i.files[0];if(!f)return;if(f.size>200*1048576){toast('Видео жуда катта (200 МБ гача)');return}cb(f)};
 i.click();
}
// Видеодан муқова расм олиш
function posterOf(b){return new Promise(res=>{
 const u=URL.createObjectURL(b),v=document.createElement('video');let ok=false;
 const end=d=>{if(ok)return;ok=true;URL.revokeObjectURL(u);res(d||'')};
 v.muted=true;v.playsInline=true;v.preload='auto';
 v.onloadeddata=()=>{try{v.currentTime=Math.min(1,(v.duration||2)/2)}catch(e){end('')}};
 v.onseeked=()=>{try{if(!v.videoWidth)return end('');const M=480,k=Math.min(1,M/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);c.getContext('2d').drawImage(v,0,0,c.width,c.height);end(c.toDataURL('image/jpeg',0.72))}catch(e){end('')}};
 v.onerror=()=>end('');setTimeout(()=>end(''),8000);v.src=u;
})}
const fixUrl=u=>{u=(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u};
async function saveMedia(ex,M){
 try{
  if(M.vid){await VDB.put(ex.id,M.vid);ex.vid=1;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  else if(!M.hasVid&&ex.vid){await VDB.del(ex.id).catch(()=>{});delete ex.vid}
 }catch(e){toast('⚠️ Видеони сақлаб бўлмади');return false}
 if(M.img)ex.img=M.img;else delete ex.img;
 const u=fixUrl(M.url);if(u)ex.vurl=u;else delete ex.vurl;
 return true;
}
function mediaField(sh,M,exId){
 const ip=sh.querySelector('#ip');let pu='';
 const draw=async()=>{
  if(pu){URL.revokeObjectURL(pu);pu=''}
  let b=M.vid;if(!b&&M.hasVid&&exId){try{b=await VDB.get(exId)}catch(e){}}
  if(b){pu=URL.createObjectURL(b);ip.innerHTML=`<video src="${pu}" controls playsinline muted loop></video>`}
  else ip.innerHTML=M.img?`<img src="${M.img}" alt="">`:'📷 Расм ёки 🎬 видео йўқ';
  sh.querySelector('#ix').style.display=(b||M.img)?'':'none';
 };
 sh.querySelector('#vu').value=M.url;
 sh.querySelector('#ib').onclick=()=>readImg(d=>{M.img=d;draw()});
 sh.querySelector('#vb').onclick=()=>readVid(f=>{M.vid=f;draw();toast('Видео танланди ✓');if(!M.img)posterOf(f).then(d=>{if(d&&!M.img)M.img=d})});
 sh.querySelector('#ix').onclick=()=>{if(M.vid||M.hasVid){M.vid=null;M.hasVid=false}else M.img='';draw()};
 draw();
 return ()=>{M.url=sh.querySelector('#vu').value;if(pu)URL.revokeObjectURL(pu)};
}
const PROG_UI=`<div id="pgw" style="margin-bottom:12px"><div class="mu sm" style="margin-bottom:6px">Кучайтириш қоидаси:</div><div class="row" style="gap:6px"><span class="sm">Ҳар</span><input class="n s" id="pn" inputmode="numeric"><span class="sm">кунда</span><span class="sp"></span><span class="sm">+</span><input class="n s" id="ps" inputmode="decimal"><span class="sm" id="pu">кг</span></div></div>`;
function progField(sh,ex){
 const et=sh.querySelector('#et'),pn=sh.querySelector('#pn'),ps=sh.querySelector('#ps');
 const upd=first=>{const t=et.value,d=progDef(t);sh.querySelector('#pgw').style.display=t==='k'?'none':'';sh.querySelector('#pu').textContent=UNIT[t]||'';
  if(first&&ex&&ex.type===t){pn.value=ex.pn||d.n;ps.value=ex.ps||d.st}else{pn.value=d.n;ps.value=d.st}};
 upd(true);et.addEventListener('change',()=>upd(false));
 return e=>{const d=progDef(e.type),n=Math.max(1,Math.min(60,parseInt(pn.value)||d.n)),st=num(ps.value)>0?num(ps.value):d.st;
  if(n!==d.n)e.pn=n;else delete e.pn;if(st!==d.st)e.ps=st;else delete e.ps};
}
const MEDIA_UI=`<div class="ipv" id="ip"></div>
<div class="row" style="gap:8px;margin-bottom:8px"><button class="btn sm sp" id="ib">📷 Расм</button><button class="btn sm sp" id="vb">🎬 Видео</button><button class="btn sm d" id="ix">✕</button></div>
<input class="in" id="vu" inputmode="url" placeholder="ёки видео ҳаволаси (YouTube, Instagram…)" style="margin-bottom:12px">`;
async function viewMedia(id){
 const e=exDef(id);if(!e)return;
 if(!e.img&&!e.vid&&!e.vurl){editEx(id);return}
 let u='';
 if(e.vid){try{const b=await VDB.get(id);if(b)u=URL.createObjectURL(b);else{delete e.vid;save();render()}}catch(x){}}
 const B='color:#fff;background:rgba(255,255,255,.15);text-decoration:none';
 const v=document.createElement('div');v.className='imgv';
 v.innerHTML=`${u?`<video src="${u}" controls playsinline loop autoplay muted></video>`:e.img?`<img src="${e.img}" alt="">`:'<div style="font-size:64px">🎬</div>'}
 <div style="color:#fff;font-weight:800;font-size:20px;margin:14px 0;text-align:center">${esc(e.name)}</div>
 <div class="row" style="gap:10px;flex-wrap:wrap;justify-content:center">${e.vurl?`<a class="btn sm" href="${esc(e.vurl)}" target="_blank" rel="noopener" style="${B}">▶ Видео ҳаволаси</a>`:''}<button class="btn sm" data-n style="${B}">✎ Ўзгартириш</button><button class="btn sm" data-c style="${B}">Ёпиш</button></div>`;
 v.onclick=ev=>{if(ev.target.closest('a')||ev.target.closest('video'))return;const n=ev.target.closest('[data-n]');if(u)URL.revokeObjectURL(u);v.remove();if(n)editEx(id)};
 document.body.appendChild(v);
}
const restOf=id=>{const e=S.ex.find(x=>x.id===id);if(!e)return 90;if(e.rest==null)return one(e.type)?0:90;return e.rest};
let AC=null;
function audioUnlock(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){try{audioUnlock();if(!AC)return;const t0=AC.currentTime;[0,0.35,0.7].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=i===2?1320:880;g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.6,t0+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.28);o.connect(g);g.connect(AC.destination);o.start(t0+d);o.stop(t0+d+0.3)})}catch(e){}}
function restStart(sec,name){if(!sec)return;S.timer={end:Date.now()+sec*1000,total:sec,name};save();restTick()}
function restStop(){S.timer=null;save();const r=$('#rest');r.classList.remove('on','end')}
function restTick(){
 const r=$('#rest'),T=S.timer;
 if(!T||!S.active){if(r.classList.contains('on')&&!r.classList.contains('end'))r.classList.remove('on');return}
 const left=T.end-Date.now();
 r.classList.add('on');
 if(left<=0){
  if(!T.fired){T.fired=true;save();r.classList.add('end');$('#rl').textContent='Дам олиш тугади — кейинги сет!';$('#rt').textContent='0:00';$('#rb').style.width='0%';beep();if(navigator.vibrate)navigator.vibrate([400,150,400,150,400]);setTimeout(()=>{if(S.timer&&S.timer.fired)restStop()},6000)}
  return;
 }
 r.classList.remove('end');
 $('#rl').textContent='Дам олиш'+(T.name?' · '+T.name:'');
 $('#rt').textContent=clock(left+999);
 $('#rb').style.width=Math.max(0,Math.min(100,left/(T.total*1000)*100))+'%';
}
document.getElementById('rest').onclick=e=>{const b=e.target.closest('[data-rt]');if(!b||!S.timer)return;const v=b.dataset.rt;
 if(v==='x'){restStop();return}
 S.timer.end+=(+v)*1000;S.timer.total=Math.max(S.timer.total+(+v),1);S.timer.fired=false;if(S.timer.end<=Date.now())S.timer.end=Date.now()+1000;save();restTick()};
function restPick(ei){
 const ex=S.active.exercises[ei],cur=restOf(ex.exId);let v=cur;
 const P=[0,30,45,60,90,120,150,180,240,300];
 const sh=sheet(`<div style="font-weight:800;font-size:18px;margin-bottom:4px">Сетлар орасида дам олиш</div>
 <div class="mu sm" style="margin-bottom:12px">${esc(ex.name)}</div>
 <div class="rp" id="rp"></div>
 <div class="row" style="justify-content:center;gap:14px;margin-bottom:14px"><button class="btn sm" data-s="-15">−15 с</button><b id="rv" style="font-size:26px;min-width:80px;text-align:center"></b><button class="btn sm" data-s="15">+15 с</button></div>
 <button class="btn p" id="ok">Сақлаш</button>`);
 const draw=()=>{sh.querySelector('#rp').innerHTML=P.map(x=>`<button class="${x===v?'on':''}" data-v="${x}">${x?clock(x*1000):'Ўчирилган'}</button>`).join('');sh.querySelector('#rv').textContent=v?clock(v*1000):'Йўқ'};
 draw();
 sh.querySelector('.sheet').addEventListener('click',e=>{const a=e.target.closest('[data-v]'),b=e.target.closest('[data-s]');if(a){v=+a.dataset.v;draw()}else if(b){v=Math.max(0,Math.min(900,v+(+b.dataset.s)));draw()}});
 sh.querySelector('#ok').onclick=()=>{const e=S.ex.find(x=>x.id===ex.exId);if(e)e.rest=v;save();sh.remove();render();toast('Дам олиш: '+(v?clock(v*1000):'ўчирилди'))};
}
let WL=null;
async function wakeOn(){try{if(S.active&&'wakeLock' in navigator&&!WL){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wakeOn();restTick()}});

function rateAsk(ei){
 const ex=S.active.exercises[ei];
 const sh=sheet(`<div style="font-weight:800;font-size:18px;margin-bottom:4px">Қанчалик қийин бўлди?</div>
 <div class="mu sm" style="margin-bottom:12px">${esc(ex.name)}</div>
 ${[1,2,3,4,5].map(n=>`<button class="rb" data-r="${n}"><b class="r${n}">${n}</b>${RATE[n]}</button>`).join('')}
 <button class="btn" data-x style="margin-top:4px">Кейинроқ</button>`);
 sh.onclick=e=>{if(e.target===sh||e.target.closest('[data-x]')){sh.remove();return}const b=e.target.closest('[data-r]');if(!b)return;ex.rate=+b.dataset.r;save();sh.remove();render()};
}

function toggle(ei,si){
 const ex=S.active.exercises[ei],s=ex.sets[si];
 if(s.done){s.done=false;save();render();return}
 const pv=lastEx(ex.exId)?.sets[si];
 if(ex.type==='t'){
  if(!s.a&&pv)s.a=String(pv.a);
  if(!num(s.a)){toast('Вақтни (дақиқа) киритинг');return}
 }else{
  if(!s.a)s.a='0';
  if(!num(s.b)&&pv&&pv.b)s.b=String(pv.b);
  if(!num(s.b)){toast('Такрор сонини киритинг');return}
 }
 s.done=true;if(navigator.vibrate)navigator.vibrate(40);audioUnlock();wakeOn();
 const allDone=S.active.exercises.every(e=>e.sets.every(x=>isDone(e,x)));
 if(!allDone)restStart(restOf(ex.exId),ex.name);
 save();render();
 if(!ex.rate&&ex.sets.every(x=>x.done))rateAsk(ei);
}

function useLast(ei){
 const ex=S.active.exercises[ei],p=lastEx(ex.exId);if(!p)return;
 ex.sets.forEach((s,k)=>{const q=p.sets[k];if(q){s.a=q.a!=null?String(q.a):'';s.b=one(ex.type)||q.b==null?'':String(q.b);if(ex.type==='k')KF.forEach(f=>{s[f]=q[f]!=null?String(q[f]):''})}});
 save();render();
}

function finish(){
 const act=S.active;
 const exs=act.exercises.map(e=>({exId:e.exId,name:e.name,type:e.type,...(e.rate?{rate:e.rate}:{}),
  sets:e.sets.filter(s=>isDone(e,s)).map(s=>e.type==='k'?Object.fromEntries(KF.filter(f=>f==='a'||num(s[f])).map(f=>[f,f==='c'||f==='hr'?Math.round(num(s[f])):num(s[f])])):e.type==='t'?{a:num(s.a)}:e.type==='r'?{b:Math.round(num(s.b))}:{a:num(s.a),b:Math.round(num(s.b))})})).filter(e=>e.sets.length);
 if(!exs.length){
  if(confirm('Бирорта сет бажарилмаган. Машғулотни бекор қиласизми?')){S.active=null;save();render()}
  return;
 }
 const prs=[];
 exs.forEach(e=>{
  const f=e.type==='r'?(s=>+s.b||0):e.type==='k'?(s=>+s.d||0):(s=>+s.a||0);
  const hist=S.wo.flatMap(w=>w.exercises.filter(x=>x.exId===e.exId&&x.type===e.type).flatMap(x=>x.sets.map(f)));
  if(!hist.length)return;
  const best=Math.max(...hist),now=Math.max(...e.sets.map(f));
  if(best>0&&now>best)prs.push(`${e.name}: ${fmtK(now)} ${e.type==='k'?'км':e.type==='t'?'дақ':e.type==='r'?'та':'кг'}`);
 });
 S.wo.push({id:uid(),name:act.name.trim()||'Машғулот',start:act.start,end:Date.now(),exercises:exs});
 S.active=null;S.timer=null;restStop();save();tab='hist';render();
 if(prs.length){
  const sh=sheet(`<div style="text-align:center;font-size:40px">🏆</div><div style="text-align:center;font-weight:800;font-size:20px;margin-bottom:12px">Янги рекорд!</div>${prs.map(p=>`<div class="pr">${esc(p)}</div>`).join('')}<button class="btn p" data-close>Ёпиш</button>`);
  sh.querySelector('[data-close]').onclick=()=>sh.remove();
 }else toast('Машғулот сақланди ✓');
}

/* ---------- Тарих ---------- */
function rHist(){
 const wk=weekStart(Date.now());
 const wkN=S.wo.filter(w=>w.start>=wk).length;
 const tot=S.wo.reduce((a,w)=>a+(w.end-w.start),0);
 const list=S.wo.slice().reverse();
 $('#main').innerHTML=`<div class="stats">
  <div><span>Жами машғулот</span><b>${S.wo.length}</b></div>
  <div><span>Бу ҳафта</span><b>${wkN}</b></div>
  <div><span>Жами вақт</span><b>${fmtDur(tot)}</b></div>
  <div><span>Охирги</span><b>${list[0]?shortD(list[0].start):'—'}</b></div>
 </div>
 ${list.map(w=>`<div class="card">
  <div class="row" style="margin-bottom:2px"><b class="sp">${esc(w.name)}</b><button class="btn sm d" data-a="delw:${w.id}">✕</button></div>
  <div class="mu sm" style="margin-bottom:8px">${fmtDate(w.start)} · ${fmtDur(w.end-w.start)}</div>
  <div class="sm">${w.exercises.map(e=>`<div style="padding:2px 0"><b>${esc(e.name)}</b>: ${e.sets.map(s=>setTxt(e,s)).join(', ')}${(()=>{if(e.type==='k')return '';const st=streak(e.exId,e.type,S.wo.indexOf(w));return st?` <span style="color:var(--ac);font-weight:700">· ${st.n}-кун</span>`:''})()}${e.rate?` <span class="mu">· баҳо ${e.rate}</span>`:''}</div>`).join('')}</div>
 </div>`).join('')||'<div class="empty">Ҳали машғулот йўқ.<br>«Машғулот» бўлимидан бошланг 💪</div>'}
 <div class="card">
  <div class="mu sm" style="margin-bottom:10px">Маълумотлар фақат шу телефонда сақланади. Телефон алмаштиришдан олдин захира олинг. Видеолар захирага кирмайди (жуда катта).</div>
  <button class="btn" data-a="backup">Захира нусха олиш</button>
  <button class="btn" data-a="restore">Захирадан тиклаш</button>
 </div>`;
}

function backup(){
 const b=new Blob([JSON.stringify(S)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download=`mashq-zaxira-${new Date().toISOString().slice(0,10)}.json`;
 document.body.appendChild(a);a.click();a.remove();
 toast('Захира файли юкланди ✓');
}
function restore(){
 const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
 i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
   const d=JSON.parse(r.result);if(!Array.isArray(d.ex)||!Array.isArray(d.wo))throw 0;
   if(!confirm('Ҳозирги маълумотлар алмаштирилсинми?'))return;
   localStorage.setItem(KEY,JSON.stringify(d));S=load();save();render();toast('Тикланди ✓');
  }catch(e){toast('Нотўғри файл')}};
  r.readAsText(f)};
 i.click();
}

/* ---------- Машқлар ---------- */
function rEx(){
 $('#main').innerHTML=`<button class="btn p" data-a="newex">+ Янги машқ</button>`+
 (S.ex.map(e=>`<div class="li">${thumb(e.id,e.name,44,'img:'+e.id)}<span class="sp"><b>${esc(e.name)}</b><br><small class="mu">${exLabel(e.type)}</small>${(()=>{if(e.type==='k')return '';const st=streak(e.id,e.type),pg=progOf(e.id);return st?`<br><small style="color:var(--ac);font-weight:700">📈 ${fmtK(st.v)} ${UNIT[e.type]} · ${st.n}/${pg.n} кун</small>`:''})()}</span>
 <button class="btn sm" data-a="rnx:${e.id}">✎</button><button class="btn sm d" data-a="delx:${e.id}">✕</button></div>`).join('')||'<div class="empty">Машқлар йўқ</div>');
}

/* ---------- Ҳодисалар ---------- */
document.getElementById('nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render();window.scrollTo(0,0)};

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const p=t.dataset.a.split(':');const a=p[0],x=p[1];const ei=+x,si=+p[2];
 if(a==='start')startW(null);
 else if(a==='tstart')startTpl(x);
 else if(a==='tnew')tplEdit(null);
 else if(a==='ppl'){addPPL(S);save();render();toast('PPL дастури қўшилди ✓')}
 else if(a==='tedit')tplEdit(x);
 else if(a==='tdel'){const t=S.tpl.find(v=>v.id===x);if(t&&confirm(`«${t.name}» тўплами ўчирилсинми?`)){S.tpl=S.tpl.filter(v=>v.id!==x);save();render()}}
 else if(a==='repeat')startW(S.wo[S.wo.length-1]);
 else if(a==='pick')pickEx();
 else if(a==='addset'){const ex=S.active.exercises[ei];if(ex.type==='k')return;const l=ex.sets[ex.sets.length-1];ex.sets.push(ex.type==='k'?{a:'',d:'',c:'',done:false}:{a:l?l.a:'',b:l?l.b:'',done:false});save();render()}
 else if(a==='done')toggle(ei,si);
 else if(a==='use')useLast(ei);
 else if(a==='rate'){const ex=S.active.exercises[ei];ex.rate=ex.rate===si?null:si;save();render()}
 else if(a==='cp'){const ex=S.active.exercises[ei],q=lastEx(ex.exId)?.sets[si],st=ex.sets[si];if(q&&st&&!st.done){if(q.a!=null)st.a=String(q.a);if(!one(ex.type)&&q.b!=null)st.b=String(q.b);if(ex.type==='k'){if(q.d!=null)st.d=String(q.d);if(q.c!=null)st.c=String(q.c)}save();render()}}
 else if(a==='rm'){if(confirm('Машқни олиб ташлайсизми?')){S.active.exercises.splice(ei,1);save();render()}}
 else if(a==='finish')finish();
 else if(a==='discard'){if(confirm('Машғулот бекор қилинсинми?')){S.active=null;restStop();save();render()}}
 else if(a==='rset')restPick(ei);
 else if(a==='img')viewMedia(x);
 else if(a==='delw'){if(confirm('Машғулот ўчирилсинми?')){S.wo=S.wo.filter(w=>w.id!==x);save();render()}}
 else if(a==='newex')newEx();
 else if(a==='rnx')editEx(x);
 else if(a==='delx'){const ex=S.ex.find(v=>v.id===x);if(ex&&confirm(`«${ex.name}» рўйхатдан ўчирилсинми?\nОлдинги машғулотлар сақланади.`)){S.ex=S.ex.filter(v=>v.id!==x);VDB.del(x).catch(()=>{});save();render()}}
 else if(a==='backup')backup();
 else if(a==='restore')restore();
});

document.addEventListener('input',e=>{
 const t=e.target;if(!S.active)return;
 if(t.id==='wname'){S.active.name=t.value;save();return}
 if(t.dataset.f){const s=S.active.exercises[+t.dataset.e].sets[+t.dataset.s];s[t.dataset.f]=t.value.replace(',','.');save()}
});

setInterval(()=>{const c=$('#clk');if(c&&S.active)c.textContent=clock(Date.now()-S.active.start);restTick()},500);

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
